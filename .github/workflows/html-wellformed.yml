# PR-only well-formedness check. No push trigger and no schedule, so this
# workflow cannot redeploy GitHub Pages or run on a timer. Pages is unchanged.

name: html-wellformed

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: html.parser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check HTML well-formedness
        run: python3 scripts/check_html.py
